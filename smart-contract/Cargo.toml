[package]
name = "near-ai-agent"
version = "0.1.0"
authors = ["NEAR Protocol"]
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = { version = "5.7.0", features = ["unit-testing"] }
near-contract-standards = "5.6.0"
serde = { version = "1.0.188", features = ["derive"] }
serde_json = { version = "1.0.107", features = ["preserve_order"] }
schemars = "0.8.12"
borsh = "1.2.1"
base64 = "0.21.0"
bs58 = "0.4.0"

[profile.release]
codegen-units = 1
# Tell `rustc` to optimize for small code size.
opt-level = "s"
lto = true
debug = false
panic = "abort"
overflow-checks = true
incremental = false

[package.metadata.near.reproducible_build]
docker_image = "ghcr.io/nearprotocol/contract-builder:latest"
docker_image_sha256 = "sha256:8c7a1a3c1a0c0c0c0c0c0c0c0c0c0c0c0c0c0c0c0c0c0c0c0c0c0c0c0c0c0c0c0"
rustc_version = "1.75.0"
rustup_version = "1.26.0"
rustc_commit_hash = "82e1608dfa6e0b5569232559e3d385fea5a93112"
rustc_commit_date = "2024-01-16"
rustc_channel = "stable"
rustc_host = "x86_64-unknown-linux-gnu"
rustc_llvm_version = "17.0.6" 